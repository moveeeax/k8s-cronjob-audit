apiVersion: batch/v1
kind: CronJob
metadata:
  name: cache-warm
  namespace: web
spec:
  schedule: "*/5 25 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: warm
              image: ghcr.io/example/cache-warm:2.0.0
